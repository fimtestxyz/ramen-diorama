/* ---------- pointer taps: spark neon / brush noren / splash puddle ---------- */
// The tap mapping lives in RamenLogic.classifyTap (pure, tested); this
// is a thin switch over it. Round 1: a street tap now also drops a
// lasting splash ring and a toast, so the feedback is observable even
// at low fps (the PDE ripple alone decays in ~1s).
function handleTap(cx, cy) {
  const r = renderer.domElement.getBoundingClientRect();
  const u = (cx - r.left) / r.width, v = (cy - r.top) / r.height; // v from top
  const px = u * 1920, py = v * 1080;
  const hit = L.classifyTap(px, py);
  if (hit.kind === 'neon') {
    L.applySpark(state.sim, hit.sign);
    if (state.audioOn) AudioEngine.crackle();
    toast('啪！霓虹燈跳了火花');
    return;
  }
  if (hit.kind === 'noren') {
    L.applyBrushNoren(state.sim, hit.panel, 2.2);
    return;
  }
  if (hit.kind === 'lantern') {
    L.applyImpulseLantern(state.sim, hit.which, 0.9);
    return;
  }
  if (hit.kind === 'steam') return; // swirl is a drag, not a tap
  if (hit.kind === 'street') {
    const fx = hit.fx, fy = hit.fy;
    if (water && !water.cpu) {
      pendingImpulses.push({ x: fx, y: fy, amp: 1.2 });
    } else if (water && water.cpu) {
      L.waterImpulse(state.sim.water.h, state.sim.water.n, fx, fy, 1.2, 0.05);
    }
    L.addRing(state.sim, fx, fy, 1.2);
    toast('水花！');
    if (state.audioOn) AudioEngine.blip(700, 240, 0.14, 0.12, (u - 0.5) * 0.6);
  }
}

/* ---------- per-frame sync from sim to scene ---------- */
const pendingImpulses = []; // tap splashes, consumed by the next frame's water step
function syncScene() {
  const sim = state.sim, p = sim.params;
  syncRainLines();
  // Parallax scale for this viewport aspect (round 1): at 16:9 it is 1
  // (full spec amplitude); on wider viewports the fixed 1.18 overscan
  // cannot cover full deflection, so the shift is scaled down just
  // enough that no plate ever leaves the frame uncovered.
  const pScale = L.parallaxScaleFor(camera.aspect);
  const px = state.pointer.x * p.parallax * pScale, py = -state.pointer.y * p.parallax * pScale;
  // Parallax: plates shift by depth; camera stays fixed.
  for (const [id, mesh] of Object.entries(plates)) {
    // Lantern plates live inside swing groups with a pivot offset in
    // mesh.position — never overwrite it here (round 1 fix); the group
    // is shifted below instead.
    if (mesh.userData.lantern) continue;
    // The emissive overlay shifts with the backdrop depth (most signs
    // live there), not its own z = 0.5, which would over-shift it.
    const z = mesh.userData.shiftZ != null ? mesh.userData.shiftZ : mesh.position.z;
    const sh = L.plateShift(z, px, py);
    mesh.position.x = sh.x;
    mesh.position.y = sh.y;
  }
  for (const strip of norenStrips) {
    const sh = L.plateShift(0.15, px, py);
    strip.position.x = sh.x;
    strip.position.y = sh.y;
    const panel = sim.noren[strip.userData.stripIndex];
    strip.material.uniforms.uDefl.value = panel.d;
    strip.material.uniforms.uWind.value = p.wind;
    strip.material.uniforms.uTime.value = sim.t;
  }
  // Lantern swings: rotate around the ceiling hook AND shift the whole
  // group with parallax (round 1 fix — the shift used to be applied to
  // the mesh inside the group, clobbering its pivot offset).
  lanternGroups.forEach((g, i) => {
    const sh = L.plateShift(g.userData.z, px, py);
    g.position.x = g.userData.baseX + sh.x;
    g.position.y = g.userData.baseY + sh.y;
    g.rotation.z = sim.lanterns[i].a;
  });
  // Steam / mist follow their plates under parallax (round 1 fix: they
  // used to stay fixed while the bowl and street moved).
  for (const m of steamMeshes) {
    const sh = L.plateShift(m.userData.shiftZ, px, py);
    m.position.x = m.userData.baseX + sh.x;
    m.position.y = m.userData.baseY + sh.y;
  }
  if (mistMesh) {
    const sh = L.plateShift(mistMesh.userData.shiftZ, px, py);
    mistMesh.position.x = mistMesh.userData.baseX + sh.x;
    mistMesh.position.y = mistMesh.userData.baseY + sh.y;
  }
  // Woman rig.
  const wm = plates['layer4'].userData.womanMat;
  if (wm) {
    wm.uniforms.uTime.value = sim.t;
    wm.uniforms.uBreath.value = sim.breath;
    wm.uniforms.uBlink.value = L.blinkAmount(sim);
    wm.uniforms.uGazeX.value = state.pointer.x * 0.8;
    wm.uniforms.uGazeY.value = -state.pointer.y * 0.6;
    wm.uniforms.uWind.value = p.wind;
  }
  // Emissive per-sign brightness.
  if (emissiveMat) {
    const u = emissiveMat.uniforms.uSigns.value;
    for (let i = 0; i < 5; i++) u[i] = sim.signs[i].flicker * (0.55 + 0.45 * p.flicker) + sim.signs[i].spark * 2.0;
    u[5] = 0.9 + 0.1 * Math.sin(sim.t * 0.8);
    u[6] = 0.9 + 0.1 * Math.sin(sim.t * 0.8 + 2.0);
    emissiveMat.uniforms.uBrownout.value = sim.events.lightningEnv;
  }
  // Street overlay.
  if (streetMat) {
    streetMat.uniforms.uTime.value = sim.t;
    streetMat.uniforms.uFlicker.value = 0.5 + 0.5 * p.flicker;
    streetMat.uniforms.uBrownout.value = sim.events.lightningEnv;
    // Tap splash rings (round 1): upload the sim's rings to the shader.
    const rings = streetMat.uniforms.uRings.value;
    for (let i = 0; i < 4; i++) {
      const rg = sim.rings[i];
      if (rg) rings[i].set(rg.x, rg.y, rg.age, rg.amp);
      else rings[i].set(0, 0, 0, 0);
    }
    if (water) {
      if (water.cpu) {
        streetMat.uniforms.uCpuWater.value = 1;
        const n = water.n;
        if (!streetMat.userData.cpuTex) {
          const tex = new THREE.DataTexture(new Uint8Array(n * n * 4), n, n, THREE.RGBAFormat);
          tex.needsUpdate = true;
          streetMat.userData.cpuTex = tex;
          streetMat.uniforms.uCpuWaterTex.value = tex;
          streetMat.uniforms.uCpuTexel.value.set(1 / n, 1 / n);
        }
        const tex = streetMat.userData.cpuTex;
        const d = tex.image.data;
        const wh = state.sim.water.h; // the sim's own heightfield (32x32)
        for (let i = 0; i < n * n; i++) {
          const v = Math.max(0, Math.min(255, 128 + wh[i] * 400));
          d[i * 4] = v; d[i * 4 + 1] = v; d[i * 4 + 2] = v; d[i * 4 + 3] = 255;
        }
        tex.needsUpdate = true;
      } else {
        streetMat.uniforms.uWater.value = waterTexture();
      }
    }
  }
  // Steam / mist.
  for (const m of steamMats) {
    m.uniforms.uTime.value = sim.t;
    m.uniforms.uAmount.value = p.steam;
    // Round 1: the swirl now comes from the sim (accumulated drag
    // angle, decaying), not from "any pointer is down".
    m.uniforms.uSwirl.value = sim.swirl;
    m.uniforms.uSwirlAng.value = sim.swirlAng;
    m.uniforms.uSwirlDir.value.set(state.pointer.x, -state.pointer.y);
  }
  if (mistMat) { mistMat.uniforms.uTime.value = sim.t; mistMat.uniforms.uSwirlAng.value = 0; }
  // Taxi.
  if (taxiGroup) {
    const ev = sim.events;
    if (ev.taxi > 0) {
      taxiGroup.visible = true;
      const fx = -0.35 + ev.taxi * 1.7; // frame fraction
      taxiGroup.position.x = (fx - 0.5) * L.PLANE_W;
      taxiGroup.position.y = -0.62;
      if (ev.taxi > 0.02 && !taxiGroup.userData.whooshed) {
        taxiGroup.userData.whooshed = true;
        if (state.audioOn) AudioEngine.whoosh();
      }
    } else {
      taxiGroup.visible = false;
      taxiGroup.userData.whooshed = false;
    }
  }
  // Post uniforms.
  if (postMat) {
    postMat.uniforms.uTime.value = sim.t;
    postMat.uniforms.uFlash.value = sim.events.lightningEnv;
    postMat.uniforms.uCurtainX.value = state.curtainX;
    postMat.uniforms.uHeat.value = 0.3 + 0.7 * p.steam;
    // Round 2: at the lowest tier the post pass runs cheap (single
    // fetch, no CAS / heat-haze) — see POST_FRAG.
    postMat.uniforms.uCheap.value = renderScale <= 0.5 ? 1 : 0;
  }
  // Drip splashes -> audio blips (from sim splash queue).
  if (state.audioOn) {
    for (const sp of sim.splashes) {
      AudioEngine.blip(800 + Math.random() * 500, 260, 0.12, 0.05, (sp.x - 0.5) * 0.5);
    }
  }
}

/* ---------- adaptive render quality (round 1) ---------- */
// The live E2E measured 4 fps in the cloud browser (software WebGL).
// The sim itself is cheap (~33x real time); the cost is GPU fill at
// full resolution. Render scale 1 / 0.75 / 0.5 cuts the fill cost to
// 100% / 56% / 25%. Auto mode steps down when slow and back up when
// comfortably fast; the HUD select overrides it manually.
let renderScale = 1, qualityMode = 'auto', qualityEvalTime = 0;
function qualityTierName(s) { return s >= 1 ? '高' : s >= 0.75 ? '中' : '低'; }
function applyRenderScale(s, isAutoStep) {
  const prev = renderScale;
  renderScale = s;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2) * s);
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (postRT && postMat) {
    postRT.setSize(renderer.domElement.width, renderer.domElement.height);
    postMat.uniforms.uRes.value.set(renderer.domElement.width, renderer.domElement.height);
  }
  // Round 2: show the ACTIVE tier in the quality select itself. The
  // control used to show only the mode ("畫質：自動"), so an auto
  // step-down was invisible and the round-1 re-test reported "Auto
  // never stepped down". Manual mode already shows the tier via the
  // selected option.
  const opt = $('sel-quality') && $('sel-quality').querySelector('option[value="auto"]');
  if (opt) {
    opt.textContent = qualityMode === 'auto'
      ? '畫質：自動 → ' + qualityTierName(s) + ' ' + (s === 1 ? '1' : s.toFixed(2).replace(/0$/, '')) + '×'
      : '畫質：自動';
  }
  if (isAutoStep && s < prev) toast('畫質已自動降至' + qualityTierName(s) + '（' + s + '×）');
}

/* ---------- main loop ---------- */
let lastT = 0, fpsFrames = 0, fpsTime = 0;
function loop(now) {
  requestAnimationFrame(loop);
  // Round 2: the RAW frame interval is the truth for the fps meter.
  // The 0.25 s clamp below is for the SIM advance only. The old code fed
  // the clamped dtWall into the meter, so it could never read below
  // 1/0.25 = 4 fps — a 2 fps frame and a 4 fps frame both read "4 fps",
  // which is why the round-1 re-test saw "no improvement" from Low
  // quality even if the frame time had halved.
  const rawDt = (lastT > 0 && now > lastT) ? (now - lastT) / 1000 : 0.016;
  const dtWall = Math.min(0.25, rawDt);
  lastT = now;
  // Cinematic drift when the pointer is idle.
  const idleFor = now - state.pointer.lastMove;
  if (idleFor > 4000 && state.drift) {
    const t = now / 1000;
    state.pointer.tx = 0.55 * Math.sin(t * 0.11);
    state.pointer.ty = 0.35 * Math.sin(t * 0.073 + 2.0);
  }
  state.pointer.x += (state.pointer.tx - state.pointer.x) * 0.04;
  state.pointer.y += (state.pointer.ty - state.pointer.y) * 0.04;
  // Fixed-step advance (spiral-of-death guarded inside).
  if (!state.paused) {
    const res = L.advance(state.sim, dtWall);
    if (res.discarded > 0.5) toast('掉幀保護：丟棄了 ' + res.discarded.toFixed(2) + 's 模擬時間', 2000);
  }
  // Water: GPU ping-pong from sim splashes + tap splashes.
  // (CPU path needs nothing here: the sim steps its own heightfield.)
  const imps = [];
  for (const sp of state.sim.splashes) imps.push({ x: sp.x, y: sp.y, amp: sp.amp });
  imps.push(...pendingImpulses);
  pendingImpulses.length = 0;
  if (water && !water.cpu) waterStepGPU(imps);
  syncScene();
  // Audio params follow the sim.
  if (state.audioOn) AudioEngine.setParams(L.audioParams(state.sim, state.pointer.x));
  // Render: post pass, or direct when the inspector says No-Post.
  const noPost = state.inspector && state.inspMode === 'no-post';
  if (noPost || !postMat) {
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
  } else {
    renderer.setRenderTarget(postRT);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCam);
  }
  // FPS meter — measured from the raw frame interval (see the top of
  // loop()): the old code accumulated the clamped dtWall, so the meter
  // floored at 4 fps and could not show slow frames truthfully.
  fpsFrames++; fpsTime += rawDt;
  if (fpsTime >= 1) {
    state.fps = Math.round(fpsFrames / fpsTime);
    state.frameMs = Math.round((fpsTime / fpsFrames) * 1000);
    fpsFrames = 0; fpsTime = 0;
    const el = $('fps');
    if (el) el.textContent = state.fps + ' fps · ' + state.frameMs + 'ms';
  }
  // Adaptive quality: in auto mode, re-evaluate the tier every 2s so a
  // single hitch does not flap it.
  if (qualityMode === 'auto') {
    qualityEvalTime += dtWall;
    if (qualityEvalTime >= 2) {
      qualityEvalTime = 0;
      const next = L.qualityTierFor(state.fps, renderScale);
      if (next !== renderScale) applyRenderScale(next, true);
    }
  }
  // Camera zoom (wheel/pinch).
  camera.fov = 2 * Math.atan((L.PLANE_H / 2) / L.CAM_D) * 180 / Math.PI / zoom;
  camera.updateProjectionMatrix();
}

/* ---------- CSS fallback (no WebGL) ---------- */
function startFallback() {
  $('loading').classList.add('hidden');
  $('app').classList.add('hidden');
  $('fallback').classList.remove('hidden');
  document.querySelectorAll('.hud').forEach((el) => el.classList.add('hidden'));
  toast('此裝置不支援 WebGL — 已切換為 CSS 視差模式');
  const imgs = [...document.querySelectorAll('#fallback .fl')];
  const onMove = (cx, cy) => {
    const px = (cx / window.innerWidth) * 2 - 1;
    const py = (cy / window.innerHeight) * 2 - 1;
    for (const im of imgs) {
      const z = parseFloat(im.dataset.z);
      const sh = L.plateShift(z, px, py);
      im.style.transform = `translate(${sh.x * 60}px, ${sh.y * 60}px)`;
    }
  };
  window.addEventListener('pointermove', (e) => onMove(e.clientX, e.clientY));
}

/* ---------- init ---------- */
async function init() {
  const bar = $('loadbar'), msg = $('loadmsg');
  const setProgress = (f, m) => { bar.style.width = Math.round(f * 100) + '%'; if (m) msg.textContent = m; };
  try {
    setProgress(0.05, '正在讀取場景資料…');
    await loadManifest();
    const manager = new THREE.LoadingManager();
    manager.onProgress = (url, loaded, total) => setProgress(0.1 + 0.8 * (loaded / total), `正在載入圖層 ${loaded}/${total}…`);
    const files = {
      layer0: 'assets/layers/layer0-backdrop.png',
      layer1: 'assets/layers/layer1-rear-lantern.png',
      layer2: 'assets/layers/layer2-noren.png',
      layer2static: 'assets/layers/layer2-static.png',
      layer3: 'assets/layers/layer3-front-lantern.png',
      layer4: 'assets/layers/layer4-woman-counter.png',
      source: 'assets/source-art.png',
      depth: 'assets/depth.png',
      'mask-rain': 'assets/masks/mask-rain.png',
      'mask-dry': 'assets/masks/mask-dry.png',
      'mask-street': 'assets/masks/mask-street.png',
      'mask-emissive': 'assets/masks/mask-emissive.png',
      'mask-cloth': 'assets/masks/mask-cloth.png',
      'mask-steam': 'assets/masks/mask-steam.png',
      'mask-flame': 'assets/masks/mask-flame.png',
    };
    const entries = Object.entries(files);
    for (const [k, url] of entries) textures[k] = await loadTexture(url, manager);
    // Depth + masks are data textures: no sRGB.
    for (const k of ['depth', 'mask-rain', 'mask-dry', 'mask-street', 'mask-emissive', 'mask-cloth', 'mask-steam', 'mask-flame']) {
      textures[k].colorSpace = THREE.NoColorSpace;
    }
    setProgress(0.92, '正在建立場景…');
    // Round 2: antialias OFF. The final pass is a fullscreen post quad,
    // so MSAA multiplies its fragment cost ~4x in software rendering
    // (fragment model at 1919x998: post 38.3M -> 9.6M fetches/frame)
    // for no visible benefit — the plate edges are off-screen at 1.18x
    // overscan, and texture-alpha edges are not smoothed by MSAA anyway.
    // The scene render into postRT was never multisampled (render
    // targets don't inherit canvas MSAA), so only the post quad changes.
    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    if (!renderer.capabilities.isWebGL2) throw new Error('WebGL2 unavailable');
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    $('app').appendChild(renderer.domElement);
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07080d);
    camera = new THREE.PerspectiveCamera(
      2 * Math.atan((L.PLANE_H / 2) / L.CAM_D) * 180 / Math.PI,
      window.innerWidth / window.innerHeight, 0.1, 20);
    camera.position.set(0, 0, L.CAM_D);
    buildPlates();
    buildLanterns();
    buildWater();
    buildStreet();
    buildEmissive();
    buildRainLines();
    buildSteamMist();
    buildTaxi();
    buildPost();
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      const w = renderer.domElement.width, h = renderer.domElement.height;
      postRT.setSize(w, h);
      postMat.uniforms.uRes.value.set(w, h);
    });
    bindHUD();
    applyMood('drizzle');
    setProgress(1, '完成');
    $('loading').classList.add('hidden');
    requestAnimationFrame(loop);
    setTimeout(() => toast('拖動滑鼠移動視角 · 點霓虹燈、撥門簾、戳水窪'), 600);
  } catch (err) {
    console.error(err);
    if (err && /WebGL2|webgl|context/i.test(String(err.message || err))) {
      startFallback();
    } else {
      $('loadmsg').textContent = '載入失敗：' + (err.message || err) + ' — 重新整理再試一次';
      toast('載入失敗：' + (err.message || err));
    }
  }
}
init();
</script>
</body>
</html>
